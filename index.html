<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guess the Number Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="./style.css">
  <style>
   
  </style>
</head>
<body >
  <div id="floatingShapes"></div>
  

<!-- Landing Section -->
<div id="box" class="container text-center " id="landing">
  <h1 id="mainTitle">Ready to Play?</h1>
  <button class="btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#gameSetupModal" id="startBtn">Start Game</button>
</div>

<!-- Game Setup Modal -->
<div class="modal fade" id="gameSetupModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-header">
        <h5 class="modal-title">🎮 Game Setup</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Select Difficulty</label>
        <select class="form-select mb-2" id="difficulty">
          <option selected disabled>Choose difficulty</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <div id="difficultyMessage" class="text-info mb-3"></div>
        <button class="btn btn-outline-success mb-3" onclick="saveDifficulty()">Save Difficulty</button>
        <hr>
        <form id="playerForm">
          <input type="text" class="form-control mb-2" id="player1" placeholder="Player 1 Name" required />
          <input type="text" class="form-control mb-2" id="player2" placeholder="Player 2 Name" required />
          <input type="text" class="form-control mb-3" id="player3" placeholder="Player 3 Name" required />
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" onclick="validateAndPlay()">Play</button>
      </div>
    </div>
  </div>
</div>

<!-- Player Input Modal -->
<div class="modal fade" id="playerInputModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-4">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="playerInputTitle">Player's Turn</h5>
      </div>
      <div class="modal-body">
        <input type="number" class="form-control" id="playerGuess" placeholder="Enter your guess (1-10)">
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" onclick="submitGuess()">Submit</button>
      </div>
    </div>
  </div>
</div>

<!-- Winner Modal -->
<div class="modal fade" id="winnerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">🎉 Game Result</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h4 id="winnerMessage" class="winner-style"></h4>
        <p>The correct number was <span id="correctNumber" class="fw-bold text-primary"></span>.</p>
        <button class="btn btn-outline-primary mt-2" onclick="location.reload()">Play Again</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="script.js">
  </script>

</body>
</html>
